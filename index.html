<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="googlefa8f69c16c187e4b" />
  <meta name="description" content="Toolnes offers free online calculators, converters, text tools, puzzles, image tools, PDF tools and more.">
  <meta name="theme-color" content="#f7f8fc">
  <title>Toolnes — Free Online Tools</title>
  <style>
    :root {
      --bg: #f7f8fc;
      --card: #ffffff;
      --text: #20243a;
      --muted: #697087;
      --purple: #6558d3;
      --border: #e9eaf2;
      --shadow: 0 8px 28px rgba(35, 39, 75, .06);
    }
    * { box-sizing: border-box }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif }
    a { color: inherit; text-decoration: none }
    header { background: #fff; border-bottom: 1px solid var(--border) }
    .nav { max-width: 1200px; margin: auto; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px }
    .logo { font-size: 27px; font-weight: 800; letter-spacing: -1px; color: var(--purple) }
    nav { display: flex; gap: 23px; flex-wrap: wrap }
    nav a { font-size: 14px; font-weight: 600; color: #51566d }
    nav a:hover { color: var(--purple) }
    main { max-width: 1200px; margin: auto; padding: 50px 24px 70px }
    .hero { text-align: center; margin: 0 auto 35px; max-width: 760px }
    .hero h1 { font-size: clamp(32px, 5vw, 48px); letter-spacing: -1.7px; margin: 0 0 15px }
    .hero h1 span { color: var(--purple) }
    .hero p { font-size: 17px; color: var(--muted); line-height: 1.7; margin: 0 }
    .search-wrap { max-width: 620px; margin: 27px auto 0 }
    #search { width: 100%; padding: 16px 18px; border: 1px solid #dedfed; border-radius: 13px; background: white; font-size: 15px; outline: none; box-shadow: var(--shadow) }
    #search:focus { border-color: var(--purple) }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a class="logo" href="/">Toolnes</a>
      <nav>
        <a href="/">Home</a>
        <a href="/text-tools/">Text Tools</a>
        <a href="/calculators/">Calculators</a>
        <a href="/puzzles/">Puzzles</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="hero">
      <h1>Free Online <span>Tools & Utilities</span></h1>
      <p>Fast, simple, and free web tools to help with your daily tasks.</p>
      <div class="search-wrap">
        <input type="text" id="search" placeholder="Search for a tool...">
      </div>
    </div>
  </main>
</body>
</html>
