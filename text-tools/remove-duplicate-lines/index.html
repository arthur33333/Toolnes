
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remove Duplicate Lines - Toolnes</title>
  <meta name="description" content="Remove duplicate lines from text online for free. Keep the first occurrence of each line and copy the clean result.">
  <link rel="canonical" href="https://toolnes.netlify.app/text-tools/remove-duplicate-lines/">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f7f7fc;color:#24213b}
    header{background:#fff;padding:20px 6%;border-bottom:1px solid #eee}
    header a{font-size:25px;font-weight:bold;color:#6d45d8;text-decoration:none}
    main{max-width:900px;margin:40px auto;padding:0 20px}
    .back{color:#6d45d8;text-decoration:none;font-weight:bold}
    h1{font-size:34px;margin-bottom:10px}
    .intro{color:#666;line-height:1.6}
    .panel{background:#fff;padding:24px;border-radius:16px;margin-top:24px;box-shadow:0 5px 25px #25204a0d}
    label{display:block;font-weight:bold;margin-bottom:10px}
    textarea{width:100%;min-height:220px;padding:15px;border:1px solid #dcd9e8;border-radius:10px;font:16px/1.5 Arial,sans-serif;resize:vertical}
    textarea:focus{outline:2px solid #8c6be8;border-color:transparent}
    .options{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px}
    .options label{display:flex;align-items:center;gap:8px;font-weight:normal;margin:0}
    .buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
    button{border:0;border-radius:9px;padding:12px 16px;background:#7048d8;color:white;font-weight:bold;cursor:pointer}
    button:hover{background:#5933bd}
    button.secondary{background:#eee9fc;color:#5432a7}
    button.secondary:hover{background:#ded4fa}
    .stats{display:flex;flex-wrap:wrap;gap:20px;margin:18px 0;color:#555}
    .stats strong{color:#6d45d8}
    .status{color:#555;font-size:14px;margin-top:14px;min-height:18px}
    footer{text-align:center;color:#777;padding:30px}
    @media(max-width:600px){h1{font-size:28px}.panel{padding:16px}}
  </style>
</head>
<body>
  <header><a href="/">Toolnes</a></header>
  <main>
    <a class="back" href="/text-tools/">← All Text Tools</a>
    <h1>Remove Duplicate Lines</h1>
    <p class="intro">Clean up your text by removing repeated lines while preserving the original order.</p>

    <section class="panel">
      <label for="input">Your text</label>
      <textarea id="input" placeholder="Paste your text here, with one item per line..."></textarea>

      <div class="options">
        <label><input type="checkbox" id="trim" checked> Ignore leading and trailing spaces</label>
        <label><input type="checkbox" id="ignoreCase"> Ignore letter case</label>
      </div>

      <div class="buttons">
        <button type="button" onclick="removeDuplicates()">Remove duplicate lines</button>
        <button type="button" class="secondary" onclick="copyResult()">Copy result</button>
        <button type="button" class="secondary" onclick="clearText()">Clear</button>
      </div>

      <div class="stats">
        <span>Original lines: <strong id="before">0</strong></span>
        <span>Unique lines: <strong id="after">0</strong></span>
        <span>Duplicates removed: <strong id="removed">0</strong></span>
      </div>

      <label for="output">Clean result</label>
      <textarea id="output" placeholder="Your cleaned text will appear here..." readonly></textarea>
      <p class="status" id="status" aria-live="polite"></p>
    </section>
  </main>
  <footer>© <span id="year"></span> Toolnes. Free online tools.</footer>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    function removeDuplicates() {
      const original = input.value.split(/\r?\n/);
      const trim = document.getElementById('trim').checked;
      const ignoreCase = document.getElementById('ignoreCase').checked;
      const seen = new Set();
      const result = [];

      for (const line of original) {
        const displayLine = trim ? line.trim() : line;
        const key = ignoreCase ? displayLine.toLocaleLowerCase() : displayLine;

        if (!seen.has(key)) {
          seen.add(key);
          result.push(displayLine);
        }
      }

      output.value = result.join('\n');
      document.getElementById('before').textContent = original.length;
      document.getElementById('after').textContent = result.length;
      document.getElementById('removed').textContent = original.length - result.length;
      status.textContent = 'Duplicate lines removed successfully.';
    }

    async function copyResult() {
      try {
        await navigator.clipboard.writeText(output.value);
        status.textContent = 'Clean result copied to clipboard.';
      } catch (error) {
        output.focus();
        output.select();
        status.textContent = 'Select the result and copy it manually.';
      }
    }

    function clearText() {
      input.value = '';
      output.value = '';
      document.getElementById('before').textContent = '0';
      document.getElementById('after').textContent = '0';
      document.getElementById('removed').textContent = '0';
      status.textContent = 'Text cleared.';
      input.focus();
    }

    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
